<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2000年 第2問 複素数平面 — 東大数学 思考誘導の構造分析</title>
  <style>
    :root{--accent:#0b72ff;--accent-dark:#0758c7;--bg:#f4f7fb;--muted:#666}
    body{font-family: "Hiragino Kaku Gothic ProN", Meiryo, "Helvetica Neue", Arial, sans-serif; margin:0; background:var(--bg); color:#111}
    main{max-width:920px; margin:28px auto; padding:20px}
    h1{font-size:1.4rem; margin:0 0 8px 0}
    p.lead{color:var(--muted); margin:0 0 18px 0}

    .problem-image{max-width:100%; height:auto; border-radius:8px; box-shadow:0 1px 6px rgba(16,24,40,0.06); margin-bottom:28px}

    .section{background:white; border-radius:8px; box-shadow:0 1px 6px rgba(16,24,40,0.06); margin-bottom:20px; padding:20px}
    .section h2{font-size:1.1rem; margin:0 0 12px 0; color:var(--accent); border-left:4px solid var(--accent); padding-left:12px}
    .section p{margin:0 0 10px 0; line-height:1.6}
    .section p:last-child{margin:0}

    .actions{margin-top:28px; display:flex; gap:12px; align-items:center}
    .btn{display:inline-block; padding:10px 14px; background:#fff; border:1px solid #e6e9ee; border-radius:6px; text-decoration:none; color:#111; font-weight:500}
    .btn.primary{background:var(--accent); color:white; border-color:var(--accent)}

    @media (max-width:600px){ main{padding:12px} .section{padding:15px} }
  </style>
</head>
<body>
  <main>
    <h1>2000年 第2問</h1>
    <p class="lead">複素数平面</p>

    <img src="2000/Q2.jpg" alt="2000年第2問の問題全体" class="problem-image" />

    <div class="section">
      <h2>分析</h2>
      <p>ここに分析の説明を記載します。</p>
    </div>

    <div class="section">
      <h2>誘導</h2>
      <p>ここに誘導の説明を記載します。</p>
    </div>

    <div class="section">
      <h2>背景</h2>
      <p>ここに背景の説明を記載します。</p>
    </div>

    <div class="actions">
      <a class="btn primary" href="javascript:history.back()">前のページへ</a>
    </div>
  </main>
</body>
</html>
